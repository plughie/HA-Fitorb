name: FitorbRelay
options:
  bundleIdPrefix: io.github.ichwars
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    FITORB_DEFAULT_HOME_ASSISTANT_URL: ""
    FITORB_DEFAULT_RELAY_TOKEN: ""
    FITORB_DEFAULT_RELAY_ID: ""
    FITORB_DEFAULT_RING_ID: ""
targets:
  FitorbRelay:
    type: application
    platform: iOS
    sources: [FitorbRelay]
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    info:
      path: FitorbRelay/Info.plist
      properties:
        CFBundleDisplayName: Fitorb Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Fitorb Relay connects to your smart ring to collect health data.
        NSHealthShareUsageDescription: Fitorb Relay checks access to the health data types you choose to share.
        NSHealthUpdateUsageDescription: Fitorb Relay saves measurements collected from your smart ring to Apple Health.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        FitorbDefaultHomeAssistantURL: $(FITORB_DEFAULT_HOME_ASSISTANT_URL)
        FitorbDefaultRelayToken: $(FITORB_DEFAULT_RELAY_TOKEN)
        FitorbDefaultRelayID: $(FITORB_DEFAULT_RELAY_ID)
        FitorbDefaultRingID: $(FITORB_DEFAULT_RING_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ichwars.fitorb.relay.ios
        PRODUCT_NAME: FitorbRelay
        MARKETING_VERSION: 0.1.10
        CURRENT_PROJECT_VERSION: 11
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: FitorbRelay/FitorbRelay.entitlements
      properties:
        com.apple.developer.healthkit: true
    scheme:
      testTargets: [FitorbRelayTests]
  FitorbRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FitorbRelayTests]
    dependencies:
      - target: FitorbRelay
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
